{% extends 'base.html' %}

{% block title %}支付订单{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h4>订单支付</h4>
                </div>
                <div class="card-body">
                    <p><strong>订单号：</strong> {{ order.order_no }}</p>
                    <p><strong>应付金额：</strong> ¥{{ order.total_amount }}</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="alert alert-info">
                            演示模式：点击“确认支付”模拟支付成功。
                        </div>
                        <button type="submit" class="btn btn-success w-100">确认支付</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
